apiVersion: v2
name: idrepo
description: A Helm chart for the My Pass Idrepo module
type: application
version: 0.0.1-develop

appVersion: ""
home: https://github.com/BHS-BS/id-repository
keywords:
  - mosip
  - idrepo
maintainers:
  - email: info@mosip.io
    name: MOSIP
dependencies:
- name: idrepo-saltgen
  alias: saltgen
  version: 0.0.1-develop
  repository: file://../idrepo-saltgen
  condition: saltgen.enabled
- name: identity
  version: 0.0.1-develop
  repository: file://../identity
  condition: identity.enabled
- name: credential
  version: 0.0.1-develop
  repository: file://../credential
  condition: credential.enabled
- name: vid
  version: 0.0.1-develop
  repository: file://../vid
  condition: vid.enabled
- name: credentialrequest
  version: 0.0.1-develop
  repository: file://../credentialrequest
  condition: credentialrequest.enabled
