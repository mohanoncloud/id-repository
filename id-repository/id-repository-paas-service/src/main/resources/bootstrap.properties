spring.cloud.config.uri=localhost
spring.cloud.config.label=0.12.0
spring.cloud.config.name=application,id-paas
spring.application.name=id-paas
spring.profiles.active=dev

management.endpoint.health.show-details=always
# Only info and health: the auth adapter lets every path and method through (below), so refresh/restart would be open.
management.endpoints.web.exposure.include=info,health
# No database check in health: only GET /app/config reads mypass_idpaas, and it serves its cached copy when the
# database is briefly down. With the check, a database blip would fail the probes and take every endpoint down.
management.health.db.enabled=false

#disabling health check so that client doesnt try to load properties from sprint config server every
# 5 minutes (should not be done in production)
health.config.enabled=false

server.port=8096
# API spec base URL: https://<idpaas-host>/v1/enrolment
server.servlet.context-path=/v1/enrolment
# native = Tomcat's RemoteIpValve: the client IP is the right-most X-Forwarded-For entry that isn't one of
# server.tomcat.remoteip.internal-proxies (Tomcat's default: private, loopback and link-local ranges), so a client
# can't pick its own IP by sending X-Forwarded-For. The app config rate limit is keyed on it. (framework would
# take the left-most entry, which the client controls.)
server.forward-headers-strategy=native

# Two images of at most 5 MB each plus the JSON part (API spec section 3). Larger -> ENR-PSP-001 (HTTP 413).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

# The app calls /v1/enrolment/* with ID PAAS session tokens, not MOSIP tokens, so the kernel auth adapter
# lets every path in this service through and EnrolmentSessionFilter authenticates the requests instead.
# The adapter skips only the methods in exclude.auth.allowed.method (default: GET only), so all are listed.
# The adapter is still used for outbound calls (selfTokenWebClient) to the ID Repository.
mosip.service-context=${server.servlet.context-path}
mosip.service.end-points=/**
mosip.service.exclude.auth.allowed.method=GET,POST,PUT,PATCH,DELETE

# Session check (working assumption until the session API owner confirms the format).
mosip.idpaas.session.token-header=Authorization
mosip.idpaas.session.token-scheme=Bearer
mosip.idpaas.session.device-signature-header=X-Device-Signature
# StubSessionVerifier accepts any token, so it is off unless this is true (tests and the dev config only).
# With it off and no real SessionVerifier, the service does not start.
#mosip.idpaas.session.stub-enabled=true

# Passport image file checks (ENR-PSP-001, HTTP 413 if too large). Keep image-max-size in line with
# spring.servlet.multipart.max-file-size above. image-max-pixels guards against decompression bombs.
mosip.idpaas.passport.image-max-size=5MB
mosip.idpaas.passport.image-min-long-side=1200
mosip.idpaas.passport.image-max-pixels=40000000

# Passport expiry (ENR-PSP-008): valid up to and including the expiry date, by today's date in this zone.
# No grace period in the API spec.
mosip.idpaas.passport.expiry-zone=America/Nassau
mosip.idpaas.passport.expiry-grace-days=0

# Printed details vs MRZ (ENR-PSP-007). A printed field read with OCR confidence below this counts as
# unreadable and asks for a retake (ENR-PSP-002) instead of the assisted desk.
mosip.idpaas.passport.printed-min-confidence=0.80
# Printed nationality word accepted for each MRZ code (the data page shows a word, the MRZ a code).
# Bahamas passports print BAHAMIAN (confirmed on MP-257). The printed code (BHS) is always accepted too.
mosip.idpaas.passport.nationality-names[BHS]=BAHAMIAN

# App config endpoint, GET /v1/enrolment/app/config (MP-243). Public: no session, limited per client IP.
# Reads idpaas.app_config in mypass_idpaas, so spring.datasource.url / username / password must come from the
# config server (id-paas-default.properties), with the password from a secret.
# A config change reaches the app within cache-ttl + max-age.
# Short connection wait (ms; Hikari's default is 30 s): with the database down, the first app launch after a pod
# starts fails fast with ENR-GEN-003 and the app uses its own cached config.
spring.datasource.hikari.connection-timeout=3000
# Longest the config read may take. The read holds the platform's refresh lock, so a hung query must not keep it.
mosip.idpaas.app-config.query-timeout=3s
mosip.idpaas.app-config.cache-ttl=30s
mosip.idpaas.app-config.max-age=60s
# Maintenance message language when the app's Accept-Language has none (codes as stored: eng, ara, ...).
mosip.idpaas.app-config.default-language=eng
# Per client IP per minute, per pod. Generous because many phones can share one carrier NAT address.
mosip.idpaas.app-config.rate-limit.requests-per-minute=120
