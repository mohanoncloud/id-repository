# Tests run without the config server or the kernel auth adapter jar.
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
mosip.auth.adapter.impl.basepackage=io.mosip.idrepository.paas
spring.main.banner-mode=off
# No real session verifier yet: tests use the stub (off by default).
mosip.idpaas.session.stub-enabled=true
