# Tests run without the config server or the kernel auth adapter jar.
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
mosip.auth.adapter.impl.basepackage=io.mosip.idrepository.paas
spring.main.banner-mode=off
# No real session verifier yet: tests use the stub (off by default).
mosip.idpaas.session.stub-enabled=true
# The app config endpoint reads mypass_idpaas (MP-243). Tests that call it mock AppConfigRepository; this URL is never
# connected to (the pool starts on first use, and there are no init scripts or DB health check).
spring.datasource.url=jdbc:postgresql://localhost:5432/mypass_idpaas
spring.datasource.username=idpaasuser
spring.sql.init.mode=never
management.health.db.enabled=false
