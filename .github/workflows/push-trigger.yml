name: Maven Package upon a push

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      message:
        description: 'Message for manually triggering'
        required: false
        default: 'Triggered for Updates'
        type: string
  push:
    # develop and main only, not develop*: that pattern also matched develop-automation and
    # every develop-<ticket> work branch, each publishing its own images to GHCR. The upstream
    # release*, master and 1.* lines are not built or deployed by BHS-BS.
    branches:
      - develop
      - main

concurrency:
  group: id-repository-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-maven-id-repository:
    uses: BHS-BS/shared-workflow/.github/workflows/maven-build.yml@develop
    with:
      SERVICE_LOCATION: ./id-repository
      BUILD_ARTIFACT: id-repository
      MAVEN_NON_EXEC_ARTIFACTS: "credential-request-generator.jar, credential-service.jar, id-repository-identity-service.jar, id-repository-salt-generator.jar, id-repository-vid-service.jar"

  build-dockers:
    needs: build-maven-id-repository
    strategy:
      matrix:
        include:
          - SERVICE_LOCATION: 'id-repository/credential-request-generator'
            SERVICE_NAME: 'credential-request-generator'
            BUILD_ARTIFACT: 'id-repository'
          - SERVICE_LOCATION: 'id-repository/credential-service'
            SERVICE_NAME: 'credential-service'
            BUILD_ARTIFACT: 'id-repository'
          - SERVICE_LOCATION: 'id-repository/id-repository-identity-service'
            SERVICE_NAME: 'id-repository-identity-service'
            BUILD_ARTIFACT: 'id-repository'
          - SERVICE_LOCATION: 'id-repository/id-repository-salt-generator'
            SERVICE_NAME: 'id-repository-salt-generator'
            BUILD_ARTIFACT: 'id-repository'
          - SERVICE_LOCATION: 'id-repository/id-repository-vid-service'
            SERVICE_NAME: 'id-repository-vid-service'
            BUILD_ARTIFACT: 'id-repository'
      fail-fast: false
    name: ${{ matrix.SERVICE_NAME }}
    permissions:
      contents: read
      packages: write
    uses: BHS-BS/shared-workflow/.github/workflows/docker-build.yml@develop
    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
      BUILD_ARTIFACT: ${{ matrix.BUILD_ARTIFACT }}

  # api-test isn't packaged or published; compile it so its build doesn't silently rot.
  compile-api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
      - name: Compile api-test
        run: mvn -B -ntp -DskipTests compile -f api-test/pom.xml
